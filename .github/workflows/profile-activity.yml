name: Update profile activity

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - README.md
      - 'scripts/**'
      - .github/workflows/profile-activity.yml

permissions:
  contents: write

concurrency:
  group: profile-activity
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Test activity calculations and API handling
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Rebuild original vector artwork
        run: python scripts/build_artwork.py
      - name: Generate cards from public data
        run: python scripts/update_activity.py
      - name: Commit updated cards
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/
          if ! git diff --cached --quiet; then
            git commit -m 'docs: update public profile activity'
            git push
          fi
