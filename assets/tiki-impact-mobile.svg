<svg xmlns="http://www.w3.org/2000/svg" width="480" height="262" viewBox="0 0 480 262" role="img" aria-labelledby="title description">
  <title id="title">Tiki contributions and a documented SQL benchmark</title>
  <desc id="description">All-time upstream Tiki merge requests: 102 into master, 136 into release branches; 238 total. These are MR counts, not distinct fixes. Reported local ranking benchmark in Tiki MR !11133: 1.642–1.830 seconds before, 0.033–0.043 seconds after, 27,689 score records and 399 users. Counts updated 2026-11-02 UTC.</desc>
  <rect x="1" y="1" width="478" height="260" rx="20" fill="#111125" stroke="#393153" />
  <text x="16" y="37" font-size="12" fill="#7de0fa" font-weight="400" font-family="DejaVu Sans Mono,monospace" letter-spacing="2">TIKI / ACCEPTED CONTRIBUTIONS</text>
  <style id="entrance-style">.entrance{animation:arrive .55s cubic-bezier(.2,.7,.2,1) both;animation-delay:var(--delay,0s)}@keyframes arrive{from{opacity:0;transform:translateY(var(--lift,6px))}to{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){.entrance{animation:none}}</style>
  <g class="entrance" style="--delay:0s;--lift:6px">
    <rect x="16" y="68" width="132" height="111" rx="12" fill="#1b1a34" stroke="#393153" />
    <text x="38" y="113" font-size="30" fill="#7de0fa" font-weight="700" font-family="DejaVu Sans,Arial,sans-serif" letter-spacing="-1">102</text>
    <text x="38" y="142" font-size="12" fill="#f6f2ff" font-weight="500" font-family="DejaVu Sans,Arial,sans-serif">Master MRs</text>
  </g>
  <g class="entrance" style="--delay:0.08s;--lift:6px">
    <rect x="174" y="68" width="132" height="111" rx="12" fill="#1b1a34" stroke="#393153" />
    <text x="196" y="113" font-size="30" fill="#ff85bd" font-weight="700" font-family="DejaVu Sans,Arial,sans-serif" letter-spacing="-1">136</text>
    <text x="196" y="142" font-size="12" fill="#f6f2ff" font-weight="500" font-family="DejaVu Sans,Arial,sans-serif">Release MRs</text>
  </g>
  <g class="entrance" style="--delay:0.16s;--lift:6px">
    <rect x="332" y="68" width="132" height="111" rx="12" fill="#1b1a34" stroke="#393153" />
    <text x="354" y="113" font-size="21" fill="#f6f2ff" font-weight="700" font-family="DejaVu Sans,Arial,sans-serif" letter-spacing="-1">33–43 ms</text>
    <text x="354" y="142" font-size="12" fill="#f6f2ff" font-weight="500" font-family="DejaVu Sans,Arial,sans-serif">SQL query</text>
    <text x="354" y="164" font-size="9" fill="#b8b3d5" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">was 1.64–1.83s</text>
  </g>
  <text x="16" y="207" font-size="10" fill="#b8b3d5" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">238 merged MRs · All-time · Updated 2026-11-02</text>
  <text x="16" y="231" font-size="10" fill="#b8b3d5" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">SQL case: 27,689 score records / 399 users</text>
  <text x="16" y="249" font-size="10" fill="#b8b3d5" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">Reported benchmark · Source: Tiki MR !11133</text>
</svg>
