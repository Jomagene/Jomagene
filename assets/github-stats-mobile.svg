<svg xmlns="http://www.w3.org/2000/svg" width="480" height="231" viewBox="0 0 480 231" role="img" aria-labelledby="title description">
  <title id="title">GitHub public profile statistics</title>
  <desc id="description">44 public repositories, 48 stars on owned non-fork public repositories, 130 followers. Updated 2026-11-02 UTC.</desc>
  <rect x="1" y="1" width="478" height="229" rx="20" fill="#111125" stroke="#393153" />
  <text x="16" y="37" font-size="12" fill="#7de0fa" font-weight="400" font-family="DejaVu Sans Mono,monospace" letter-spacing="2">GITHUB / PUBLIC ACTIVITY</text>
  <style id="entrance-style">.entrance{animation:arrive .55s cubic-bezier(.2,.7,.2,1) both;animation-delay:var(--delay,0s)}@keyframes arrive{from{opacity:0;transform:translateY(var(--lift,6px))}to{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){.entrance{animation:none}}</style>
  <g class="entrance" style="--delay:0s;--lift:6px">
    <rect x="16" y="68" width="132" height="111" rx="12" fill="#1b1a34" stroke="#393153" />
    <text x="38" y="113" font-size="30" fill="#7de0fa" font-weight="700" font-family="DejaVu Sans,Arial,sans-serif" letter-spacing="-1">44</text>
    <text x="38" y="142" font-size="12" fill="#f6f2ff" font-weight="500" font-family="DejaVu Sans,Arial,sans-serif">Public repos</text>
  </g>
  <g class="entrance" style="--delay:0.08s;--lift:6px">
    <rect x="174" y="68" width="132" height="111" rx="12" fill="#1b1a34" stroke="#393153" />
    <text x="196" y="113" font-size="30" fill="#ff85bd" font-weight="700" font-family="DejaVu Sans,Arial,sans-serif" letter-spacing="-1">48</text>
    <text x="196" y="142" font-size="12" fill="#f6f2ff" font-weight="500" font-family="DejaVu Sans,Arial,sans-serif">Stars earned</text>
  </g>
  <g class="entrance" style="--delay:0.16s;--lift:6px">
    <rect x="332" y="68" width="132" height="111" rx="12" fill="#1b1a34" stroke="#393153" />
    <text x="354" y="113" font-size="30" fill="#f6f2ff" font-weight="700" font-family="DejaVu Sans,Arial,sans-serif" letter-spacing="-1">130</text>
    <text x="354" y="142" font-size="12" fill="#f6f2ff" font-weight="500" font-family="DejaVu Sans,Arial,sans-serif">Followers</text>
  </g>
  <text x="16" y="210" font-size="10" fill="#b8b3d5" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif">Stars exclude forks · Public data</text>
  <text x="464" y="210" font-size="10" fill="#b8b3d5" font-weight="400" font-family="DejaVu Sans,Arial,sans-serif" text-anchor="end">2026-11-02 UTC</text>
</svg>
